<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presensi Ceria – Kelas 5 B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --sky:#bfe6ff; --sky-d:#5db7ee; --sky-dd:#2f8fcc;
  --mint:#c9f2de; --mint-d:#4fc58f; --mint-dd:#2a9f6b;
  --sun:#fff1b8; --sun-d:#f4c542; --sun-dd:#b98a00;
  --pink:#ffd3dc; --pink-d:#f0788f;
  --lav:#e4dcff; --lav-d:#9a85e6;
  --ink:#24425a; --ink2:#5b7387; --line:#dbe9f3; --bg:#f3faff; --card:#ffffff;
  --r:20px; --sh:0 6px 18px rgba(63,128,170,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.hide{display:none!important}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
#side{background:linear-gradient(180deg,#e6f5ff 0%,#e9fbf2 100%);border-right:2px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand .logo{width:46px;height:46px;border-radius:16px;background:var(--sun);display:grid;place-items:center;font-size:26px;box-shadow:var(--sh)}
.brand b{font-family:'Baloo 2';font-size:19px;display:block;line-height:1}
.brand small{color:var(--ink2);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 0;border-radius:16px;color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer;border:2px solid transparent}
.nav a .ic{font-size:20px;width:26px;text-align:center}
.nav a:hover{background:#fff8}
.nav a.on{background:#fff;border-color:var(--sky);box-shadow:var(--sh)}
.side-foot{margin-top:18px;padding:12px;border-radius:16px;background:#fff9;font-size:13px}
#main{min-width:0;padding:22px 26px 90px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.chip.kelas{background:var(--sun);border-color:#f7dd7e;font-size:15px}
#burger{display:none;border:0;background:#fff;border-radius:14px;width:42px;height:42px;font-size:20px;box-shadow:var(--sh)}
#bnav{display:none}

/* ---------- Komponen ---------- */
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.ph h2{font-size:28px}
.ph .sp{flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:2px solid #eef6fb}
.card h3{font-size:19px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{border-radius:var(--r);padding:16px;position:relative;overflow:hidden;box-shadow:var(--sh);animation:pop .4s ease both}
.stat .n{font-family:'Baloo 2';font-size:38px;font-weight:800;line-height:1}
.stat .l{font-weight:800;margin-top:4px}
.stat .s{font-size:12.5px;color:var(--ink2);font-weight:600}
.stat .em{position:absolute;right:10px;top:6px;font-size:34px;opacity:.85}
.c-sky{background:var(--sky)}.c-mint{background:var(--mint)}.c-sun{background:var(--sun)}.c-pink{background:var(--pink)}.c-lav{background:var(--lav)}.c-wh{background:#fff;border:2px solid var(--line)}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{border-radius:28px;padding:22px 26px;background:linear-gradient(120deg,var(--sky) 0%,var(--mint) 100%);display:flex;gap:18px;align-items:center;margin-bottom:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h1{font-size:30px}
.hero p{margin:6px 0 0;font-weight:700;color:#2f5873}
.hero .art{margin-left:auto;font-size:46px;letter-spacing:4px;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--sky);color:var(--ink);display:inline-flex;gap:8px;align-items:center;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--sky-d);color:#fff}
.btn.ok{background:var(--mint-d);color:#fff}
.btn.warn{background:var(--sun);}
.btn.bad{background:var(--pink-d);color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--line)}
.btn.sm{padding:6px 10px;border-radius:11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:140px}
.fld label{font-weight:800;font-size:13px;color:var(--ink2)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;min-height:42px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--sky-d);outline:0}
.tw{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:#fff}
table.tbl{border-collapse:collapse;width:100%;min-width:640px}
.tbl th{background:#e8f5ff;font-size:13px;text-align:center;padding:9px 8px;position:sticky;top:0;white-space:nowrap}
.tbl td{padding:8px;border-top:1px solid var(--line);text-align:center}
.tbl td.l,.tbl th.l{text-align:left}
.tbl tbody tr:nth-child(even){background:#fafdff}
.tbl tfoot td{background:#fff9dd;font-weight:800;border-top:2px solid var(--sun-d)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800}
.b-demo{background:var(--sun);color:#7a5a00}
.b-ok{background:var(--mint);color:#1d6e4a}.b-no{background:var(--pink);color:#a3294a}
.p-good{background:var(--mint);color:#17603f}.p-warn{background:var(--sun);color:#7a5a00}.p-bad{background:var(--pink);color:#a3294a}.p-na{background:#eef3f7;color:var(--ink2)}
.pill{padding:3px 10px;border-radius:999px;font-weight:800;font-size:13px;display:inline-block;min-width:58px}
.empty{padding:28px;text-align:center;color:var(--ink2);font-weight:700}
.empty .em{font-size:40px;display:block}
.note{background:var(--sun);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
.note.info{background:var(--sky)}
.hint{font-size:12.5px;color:var(--ink2);font-weight:600}
.chartbox{position:relative;height:280px}

/* ---------- Presensi ---------- */
.srow{display:grid;grid-template-columns:minmax(180px,1.2fr) auto minmax(160px,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:#fff;margin-bottom:8px}
.srow.kosong{background:#fffbea;border-color:#f7dd7e}
.srow .nm b{display:block}
.srow .nm small{color:var(--ink2);font-weight:700}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;font-weight:800;font-size:13px}
.seg button.on.Hadir{background:var(--mint-d);border-color:var(--mint-d);color:#fff}
.seg button.on.Terlambat{background:var(--sun-d);border-color:var(--sun-d)}
.seg button.on.Sakit{background:var(--lav-d);border-color:var(--lav-d);color:#fff}
.seg button.on.Izin{background:var(--sky-d);border-color:var(--sky-d);color:#fff}
.seg button.on.Alpa{background:var(--pink-d);border-color:var(--pink-d);color:#fff}
.seg.lock button{opacity:.7;cursor:default}

.ninp{width:88px;text-align:center;padding:6px;min-height:38px}
.ninp.bad{border-color:var(--pink-d);background:#fff0f3}

/* ---------- Kalender ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-weight:800;color:var(--ink2);font-size:13px;padding:4px}
.cal .d{min-height:74px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cal .d b{font-size:15px}
.cal .d small{font-size:11px;font-weight:700;color:var(--ink2)}
.cal .d.full{background:var(--mint);border-color:var(--mint-d)}
.cal .d.part{background:var(--sun);border-color:var(--sun-d)}
.cal .d.weekend{background:#eef2f6;color:#8a9aa8}
.cal .d.libur{background:var(--pink);border-color:var(--pink-d)}
.cal .d.future{background:#fff}
.cal .d.today{box-shadow:0 0 0 3px var(--sky-d)}
.cal .d.sel{outline:3px solid var(--ink)}
.cal .d.x{visibility:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:5px;vertical-align:-2px;border:2px solid var(--line)}

/* ---------- Modal / toast ---------- */
#modalRoot{position:fixed;inset:0;background:#18324a66;display:none;place-items:center;z-index:50;padding:14px}
#modalRoot.on{display:grid}
.modal{background:#fff;border-radius:24px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:22px;margin-bottom:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form2 .full{grid-column:1/-1}
#toasts{position:fixed;right:14px;top:14px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.toast{padding:12px 16px;border-radius:14px;font-weight:800;box-shadow:var(--sh);animation:pop .25s ease both;background:var(--mint);color:#17603f}
.toast.err{background:var(--pink);color:#a3294a}
.toast.inf{background:var(--sky);color:#1e5a85}
#loader{position:fixed;inset:0;background:#ffffffaa;display:none;place-items:center;z-index:60;font-weight:800}
#loader.on{display:grid}
.spin{width:46px;height:46px;border-radius:50%;border:6px solid var(--sky);border-top-color:var(--sky-dd);animation:sp 0.8s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Login ---------- */
.pwwrap{position:relative}
.pwwrap input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;border-radius:10px;color:var(--ink2);display:grid;place-items:center}
.eye:hover{background:var(--sky)}
.eye.on{color:var(--sky-dd)}

#login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,var(--sky),var(--mint) 60%,var(--sun))}
.lgbox{background:#fff;border-radius:30px;padding:30px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(36,66,90,.2);text-align:center}
.lgbox .big{font-size:56px}
.lgbox h1{font-size:30px;margin:6px 0 2px}
.lgbox form{text-align:left;margin-top:18px;display:grid;gap:12px}

/* ---------- Laporan ---------- */
.paper{background:#fff;border:2px solid var(--line);border-radius:12px;padding:18px;overflow-x:auto}
.sigprev{max-height:60px;border:2px dashed var(--line);border-radius:10px;padding:4px;background:#fff}

/* ---------- Responsif ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  #app{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-105%);transition:transform .2s}
  #side.open{transform:none;box-shadow:0 0 0 100vmax #18324a55}
  #burger{display:block}
  #main{padding:14px 12px 90px}
  .hero{flex-direction:column;align-items:flex-start}
  .hero .art{margin-left:0;font-size:36px}
  .hero h1{font-size:24px}
  .g2{grid-template-columns:1fr}
  #bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  #bnav a{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--ink2);padding:4px;border-radius:12px;cursor:pointer}
  #bnav a .ic{font-size:21px}
  #bnav a.on{background:var(--sky);color:var(--ink)}
}
@media (max-width:640px){
  .srow{grid-template-columns:1fr}
  .form2{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .stat .n{font-size:30px}
  .cal{gap:3px}.cal .d{min-height:56px;padding:4px}.cal .d small{display:none}
  .ph h2{font-size:23px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="hide">
  <div class="lgbox">
    <div class="big">🎒📚✏️</div>
    <h1>Presensi Ceria</h1>
    <b style="color:var(--sky-dd)">Kelas 5 B</b>
    <form id="lgForm" onsubmit="doLogin(event)">
      <div class="fld"><label for="lgU">Nama pengguna</label><input id="lgU" type="text" autocomplete="username" required></div>
      <div class="fld"><label for="lgP">Kata sandi</label><div class="pwwrap"><input id="lgP" type="password" autocomplete="current-password" required><button type="button" class="eye" id="lgEye" aria-label="Tampilkan kata sandi" aria-pressed="false" onclick="togglePw('lgP','lgEye')"><svg id="lgEyeSvg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div id="lgErr" class="note hide" style="background:var(--pink)"></div>
      <button class="btn pri" type="submit" id="lgBtn" style="justify-content:center">Masuk</button>
    </form>
  </div>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><div class="logo">🎒</div><div><b>Presensi Ceria</b><small>Kelas <span class="kls">5 B</span></small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>👤 <b id="uNama">–</b></div>
      <div class="hint" id="uPeran"></div>
      <button class="btn ghost sm" style="margin-top:8px" onclick="doLogout()">Keluar</button>
    </div>
  </aside>
  <main id="main">
    <div class="topbar">
      <button id="burger" aria-label="Buka menu" onclick="toggleSide()">☰</button>
      <span class="chip kelas">🏫 Kelas <span class="kls">5 B</span></span>
      <span class="chip" id="hdTA"></span>
      <span class="grow"></span>
      <button class="btn ghost sm" id="btnHome" onclick="go('dashboard')">🏠 Dashboard</button>
    </div>
    <section class="page" id="pg-dashboard"></section>
    <section class="page hide" id="pg-siswa"></section>
    <section class="page hide" id="pg-presensi"></section>
    <section class="page hide" id="pg-kalender"></section>
    <section class="page hide" id="pg-bulanan"></section>
    <section class="page hide" id="pg-semester"></section>
    <section class="page hide" id="pg-nilai"></section>
    <section class="page hide" id="pg-laporan"></section>
    <section class="page hide" id="pg-pengaturan"></section>
  </main>
  <nav id="bnav"></nav>
</div>

<div id="modalRoot"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div><div class="spin"></div><span id="loaderTxt">Memuat…</span></div></div>

<script>
/* =====================================================================
   PRESENSI CERIA – KELAS 5 B  (frontend)
   Semua perhitungan rekap dilakukan dari data presensi harian tersimpan.
   ===================================================================== */
var TOKEN = null;
var S = null;                 // state data
var UI = {page:'dashboard', pDate:null, draft:{}, locked:false, dirty:false,
          siswaQ:'', siswaSort:'nama', calY:0, calM:0, calSel:null,
          nTab:'input', nSem:'', nMapel:'', nSiswa:'', nDraft:{}, penEdit:[], penMid:'', rbY:0, rbM:0, rbQ:'', rsSem:'1', rsCustom:false, rsA:'', rsB:'', rsQ:'', lap:{}};
var charts = {};
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var STATUS = ['Hadir','Terlambat','Sakit','Izin','Alpa'];
var STATUS_EMO = {Hadir:'✅',Terlambat:'⏰',Sakit:'🤒',Izin:'📝',Alpa:'❌'};
var MENU = [
  ['dashboard','🏠','Dashboard'],['siswa','🧒','Data Siswa'],['presensi','✅','Presensi Harian'],
  ['kalender','📅','Kalender Presensi'],['bulanan','📊','Rekap Bulanan'],['semester','📈','Rekap Semester'],['nilai','🏅','Daftar Nilai'],
  ['laporan','🖨️','Laporan dan Ekspor'],['pengaturan','⚙️','Pengaturan']
];

/* ---------------- util ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function p2(n){return String(n).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parseYmd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function today(){return ymd(new Date())}
function fmtTgl(s){var d=parseYmd(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()}
function fmtTglPanjang(s){var d=parseYmd(s);return d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()}
function fmtTglPendek(s){var d=parseYmd(s);return d.getDate()+' '+BULAN[d.getMonth()].substring(0,3)+' '+d.getFullYear()}
function num(n,d){return Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d})}
function pct(a,b){return b>0?(a/b*100):null}
function fmtPct(v){return v==null?'–':num(v,1)+'%'}
function byNama(a,b){return a.nama.localeCompare(b.nama,'id')}
function val(id){var e=document.getElementById(id);return e?e.value:''}
function monthRange(y,m){return [y+'-'+p2(m)+'-01', y+'-'+p2(m)+'-'+p2(new Date(y,m,0).getDate())]}
function ymKey(y,m){return y+'-'+p2(m)}
function fileSafe(s){return String(s).replace(/[^A-Za-z0-9._-]+/g,'_')}

function busy(on,txt){
  busy.n=(busy.n||0)+(on?1:-1); if(busy.n<0)busy.n=0;
  $('#loaderTxt').textContent=txt||'Memuat…';
  $('#loader').classList.toggle('on',busy.n>0);
}
function toast(msg,type){
  var t=document.createElement('div');t.className='toast'+(type==='err'?' err':type==='inf'?' inf':'');
  t.textContent=msg;$('#toasts').appendChild(t);
  setTimeout(function(){t.remove()},type==='err'?6500:3200);
}
function cleanErr(m){m=String(m||'Terjadi kesalahan.');while(/^(Exception|Error):\s*/.test(m))m=m.replace(/^(Exception|Error):\s*/,'');return m}
/* URL aplikasi web Apps Script (backend). Frontend ini boleh di-hosting di GitHub Pages. */
var API_URL='https://script.google.com/macros/s/AKfycbxx3qCSQAhGmjMHxqqtky4R7Tn7CBz1FNj6O3LFaxksWoQiRE-LGN-vmHnKiEZpGpi5/exec';
function api(fn){
  var args=Array.prototype.slice.call(arguments,1);
  var full=(fn==='api_login')?args:[TOKEN].concat(args);
  var fail=function(m){
    m=cleanErr(m);
    if(m.indexOf('SESI_HABIS')>=0){sesiHabis();return new Error('Sesi berakhir. Silakan masuk kembali.')}
    return new Error(m);
  };
  // Mode 1: dibuka langsung dari Apps Script (google.script.run tersedia)
  if(window.google&&google.script&&google.script.run){
    return new Promise(function(res,rej){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(fail(e&&e.message))});
      r[fn].apply(r,full);
    });
  }
  // Mode 2: di-hosting di GitHub/hosting lain -> panggil Web App lewat fetch
  return fetch(API_URL,{method:'POST',redirect:'follow',body:JSON.stringify({fn:fn,args:full})})
    .then(function(r){return r.text()})
    .then(function(t){
      var j;try{j=JSON.parse(t)}catch(e){throw fail('Server tidak membalas dengan benar. Pastikan deployment Apps Script diatur "Siapa saja" dan sudah memakai versi terbaru.')}
      if(!j.ok)throw fail(j.error);
      return j.data;
    },function(){throw fail('Tidak dapat terhubung ke server. Periksa koneksi internet dan URL Web App.')});
}

function aktifSiswa(){return S.siswa.filter(function(s){return s.aktif}).sort(byNama)}
function hariSekolahSet(){return S.set.hariSekolah.split(',').filter(Boolean).map(Number)}
function isSchool(t){
  var k=S.kal[t];if(k)return k.jenis==='sekolah';
  return hariSekolahSet().indexOf(parseYmd(t).getDay())>=0;
}
function schoolDays(a,b){
  var out=[];for(var d=parseYmd(a);ymd(d)<=b;d.setDate(d.getDate()+1)){var t=ymd(d);if(isSchool(t))out.push(t)}
  return out;
}
function semRange(n){return n==='2'?[S.set.sem2Mulai,S.set.sem2Selesai]:[S.set.sem1Mulai,S.set.sem1Selesai]}
function semesterOf(t){
  if(t>=S.set.sem1Mulai&&t<=S.set.sem1Selesai)return '1';
  if(t>=S.set.sem2Mulai&&t<=S.set.sem2Selesai)return '2';
  return null;
}
/* Hari efektif untuk rentang [a,b]. Bila 'manual' dan bulan itu diisi guru, nilai manual dipakai;
   jika tidak, dipakai jumlah hari sekolah menurut kalender. */
function efektifRentang(a,b,manual){
  var total=0,det=[];var d=parseYmd(a);d.setDate(1);
  while(ymd(d)<=b){
    var y=d.getFullYear(),m=d.getMonth()+1,key=ymKey(y,m),mr=monthRange(y,m);
    var s=a>mr[0]?a:mr[0],e=b<mr[1]?b:mr[1];
    var kal=schoolDays(s,e).length,man=S.ef[key];
    var v=(manual&&man!==undefined)?man:kal;
    det.push({key:key,y:y,m:m,s:s,e:e,kal:kal,man:man,val:v});total+=v;
    d=new Date(y,m,1);
  }
  return {total:total,det:det};
}
function hitung(a,b,list,manual){
  var days=schoolDays(a,b),tdy=today(),ef=efektifRentang(a,b,manual);
  var tot={Hadir:0,Terlambat:0,Sakit:0,Izin:0,Alpa:0,belum:0};
  var rows=list.map(function(s){
    var c={Hadir:0,Terlambat:0,Sakit:0,Izin:0,Alpa:0,belum:0};
    days.forEach(function(t){var r=S.pres[s.id+'|'+t];if(r&&c[r.status]!==undefined)c[r.status]++;else if(t<=tdy)c.belum++});
    var hadir=c.Hadir+c.Terlambat,tidak=c.Sakit+c.Izin+c.Alpa;
    Object.keys(tot).forEach(function(k){tot[k]+=c[k]});
    return {s:s,hari:ef.total,Hadir:c.Hadir,Terlambat:c.Terlambat,Sakit:c.Sakit,Izin:c.Izin,Alpa:c.Alpa,belum:c.belum,hadir:hadir,tidak:tidak,
      pHadir:pct(hadir,ef.total),pTidak:pct(tidak,ef.total),pAlpa:pct(c.Alpa,ef.total),pTerlambat:pct(c.Terlambat,ef.total)};
  });
  var n=list.length,denom=ef.total*n,hadirT=tot.Hadir+tot.Terlambat,tidakT=tot.Sakit+tot.Izin+tot.Alpa;
  var rec=hadirT+tidakT;
  return {days:days,ef:ef,rows:rows,n:n,denom:denom,tot:tot,hadirT:hadirT,tidakT:tidakT,
    pHadir:pct(hadirT,denom),pTidak:pct(tidakT,denom),pSakit:pct(tot.Sakit,denom),pIzin:pct(tot.Izin,denom),
    pAlpa:pct(tot.Alpa,denom),pTerlambat:pct(tot.Terlambat,denom),
    lengkap:pct(rec,rec+tot.belum)};
}

async function hapusSiswa(id){
  var s=S.siswa.filter(function(x){return x.id===id})[0];if(!s)return;
  var jml=Object.keys(S.pres).filter(function(k){return k.indexOf(id+'|')===0}).length;

  if(!ok)return;

    await act('api_deleteSiswa',[id]);

    Object.keys(S.nilai).forEach(function(k){if(k.indexOf(id+'|')===0)delete S.nilai[k]});
    toast('Siswa dihapus.');renderSiswa();
  }catch(e){}
}

function normKey(k){return String(k).toLowerCase().replace(/[^a-z0-9]/g,'')}
function imporSiswa(inp){
  var f=inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var js=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
      var list=[];
      js.forEach(function(r){
        var o={};Object.keys(r).forEach(function(k){o[normKey(k)]=String(r[k]).trim()});
        var nisn=(o.nisn||'').replace(/\D/g,'');if(nisn&&nisn.length<10)nisn=nisn.padStart(10,'0');
        var nama=o.namalengkap||o.nama||'';if(!nama&&!nisn)return;
        var st=(o.status||o.aktif||'aktif').toLowerCase();
        var jk=(o.jeniskelaminlp||o.jeniskelamin||o.jk||o.lp||'L').toUpperCase().charAt(0);
        list.push({nisn:nisn,nis:o.nis||'',nama:nama,jk:jk==='P'?'P':'L',kelas:o.kelas||S.set.kelas,
          ortu:o.namaorangtuawali||o.orangtuawali||o.ortu||o.namaortu||'',kontak:o.nomorkontak||o.kontak||o.hp||o.telepon||'',
          aktif:!(st==='tidak aktif'||st==='nonaktif'||st==='tidakaktif'||st==='false'||st==='0')});
      });
      inp.value='';
      if(!list.length){toast('Tidak ada baris data yang terbaca. Gunakan templat impor.','err');return}
      openModal('Impor data siswa','<p>Ditemukan <b>'+list.length+'</b> baris. Siswa dengan NISN yang sudah ada akan diperbarui, yang baru akan ditambahkan.</p>',[
        {text:'Batal',cls:'ghost',fn:closeModal},
        {text:'Impor sekarang',cls:'pri',fn:async function(){
          closeModal();
          try{
            var r=await act('api_importSiswa',[list],{txt:'Mengimpor siswa…'});
            await refreshData();
            var msg='Impor selesai: '+r.tambah+' ditambah, '+r.ubah+' diperbarui.';
            if(r.gagal.length){openModal('Hasil impor','<p>'+msg+'</p><p><b>'+r.gagal.length+' baris dilewati:</b></p><div style="max-height:200px;overflow:auto;font-size:13px">'+r.gagal.map(esc).join('<br>')+'</div>',[{text:'Tutup',cls:'pri',fn:closeModal}])}
            else toast(msg);
            renderSiswa();
          }catch(e){}
        }}]);
    }catch(e){toast('File tidak dapat dibaca: '+e.message,'err')}
  };
  rd.readAsArrayBuffer(f);
}

  var hn=$('#pHint');if(hn)hn.textContent=l?'Presensi tanggal ini sudah tersimpan. Klik “Edit Presensi” untuk mengubah.':(UI.dirty?'⚠️ Ada perubahan yang belum disimpan.':'Pilih status tiap siswa. Klik status yang sama sekali lagi untuk mengosongkannya.');

  var top=st.rows.filter(function(r){return r.pHadir!=null}).slice().sort(function(a,b){return b.pHadir-a.pHadir}),mx=top.length?top[0].pHadir:null;

    '<div class="card"><h3>⏰ Terlambat terbanyak</h3>'+(lates.length?lates.map(function(r){return '<div><b>'+esc(r.s.nama)+'</b> – '+r.Terlambat+' kali</div>'}).join(''):'<div class="hint">Tidak ada keterlambatan tercatat.</div>')+'</div>'+
    '<div class="card"><h3>🧾 Kelengkapan pengisian</h3><div style="font-family:Baloo 2;font-size:32px;font-weight:800">'+fmtPct(st.lengkap)+'</div><div style="height:10px;border-radius:99px;background:#e8f1f7;overflow:hidden"><div style="height:100%;width:'+(st.lengkap||0)+'%;background:var(--mint-d)"></div></div><div class="hint" style="margin-top:6px">'+st.tot.belum+' hari-siswa belum diabsen (sampai hari ini).</div></div></div>';
  h+='<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Persentase kehadiran tiap siswa</h3><div class="chartbox" style="height:'+Math.max(280,n*26)+'px"><canvas id="'+prefix+'Bar"></canvas></div></div><div class="card"><h3>Perbandingan status</h3><div class="chartbox"><canvas id="'+prefix+'Pie"></canvas></div>'+(prefix==='rs'?'<h3 style="margin-top:14px">Tren kehadiran per bulan</h3><div class="chartbox"><canvas id="rsTren"></canvas></div>':'')+'</div></div>';
  h+='<div class="card" style="margin-top:12px"><h3>Tabel rekap</h3><div class="tw"><table class="tbl"><thead><tr><th>No</th><th>NISN</th><th class="l">Nama siswa</th><th>Hari efektif</th><th>Hadir tepat waktu</th><th>Terlambat</th><th>Total hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Belum diabsen</th><th>% Hadir</th><th>% Tidak hadir</th></tr></thead><tbody>';
  st.rows.forEach(function(r,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(r.s.nisn)+'</td><td class="l"><b>'+esc(r.s.nama)+'</b>'+(r.s.demo?' <span class="badge b-demo">CONTOH</span>':'')+'</td><td>'+r.hari+'</td><td>'+r.Hadir+'</td><td>'+r.Terlambat+'</td><td><b>'+r.hadir+'</b></td><td>'+r.Sakit+'</td><td>'+r.Izin+'</td><td>'+r.Alpa+'</td><td>'+r.belum+'</td><td>'+pPill(r.pHadir)+'</td><td>'+fmtPct(r.pTidak)+'</td></tr>'});

function rekapCharts(prefix,st){

}

function rsEfektif(){

  var ef=efektifRentang(r[0],r[1],true);

  ef.det.forEach(function(d){h+='<div class="fld" style="min-width:120px"><label for="ef_'+d.key+'">'+BULAN[d.m-1].substring(0,3)+' '+d.y+'</label><input type="number" min="0" max="31" id="ef_'+d.key+'" data-k="'+d.key+'" placeholder="'+d.kal+'" value="'+(d.man===undefined?'':d.man)+'"></div>'});
  h+='<button class="btn ok" onclick="simpanEfSemua()">💾 Simpan semua</button></div>';

async function simpanEfSemua(){
  var ins=$$('#rsEf input[data-k]'),jobs=[];
  for(var i=0;i<ins.length;i++){var v=ins[i].value.trim();if(v!==''&&(!/^\d+$/.test(v)||+v>31)){toast('Hari efektif harus bilangan bulat 0–31.','err');return}
    var cur=S.ef[ins[i].getAttribute('data-k')];if((v===''&&cur!==undefined)||(v!==''&&+v!==cur))jobs.push([ins[i].getAttribute('data-k'),v])}
  if(!jobs.length){toast('Tidak ada perubahan.','inf');return}
  busy(true,'Menyimpan hari efektif…');
  try{for(var j=0;j<jobs.length;j++){await api('api_saveEfektif',jobs[j][0],jobs[j][1]);if(jobs[j][1]==='')delete S.ef[jobs[j][0]];else S.ef[jobs[j][0]]=+jobs[j][1]}
    toast('Hari efektif tersimpan. Rekap diperbarui.');}catch(e){toast(e.message,'err')}finally{busy(false)}
  renderSemester();
}

}

function repAoa(rep){
  var L=UI.lap,aoa=[],n=rep.headers.length,merges=[];

  if(L.resmi){
    row([S.set.namaSekolah.toUpperCase()]);row([S.set.alamatSekolah]);row(['LAPORAN PRESENSI SISWA']);row([rep.judul]);row([]);

    row([]);

  }else{row([rep.judul+' – '+rep.periode]);row([])}
  var hr=aoa.length;row(rep.headers);
  rep.rows.forEach(function(r){row(r.map(function(v,ci){var ty=rep.types[ci];if(v===''||v==null)return '';if((ty==='pct'||ty==='dec')&&typeof v==='number')return Math.round(v*100)/100;if(ty==='int'&&typeof v==='number')return v;return String(v)}))});
  row([]);row(['Ringkasan statistik']);
  rep.summary.forEach(function(r){row([r[0],r[1]])});
  if(rep.rumus){row([]);row([rep.rumus])}
  if(rep.catatan)row(['Catatan: '+rep.catatan]);
  if(L.ttd){
    row([]);row([]);
    var c2=Math.max(Math.floor(n/2),2),a1=new Array(n).fill(''),a2=a1.slice(),a3=a1.slice(),a4=a1.slice(),a5=a1.slice();
    a1[0]='Mengetahui,';a1[c2]=S.set.kota+', '+fmtTglPanjang(today());
    a2[0]='Kepala Sekolah';a2[c2]='Guru Kelas '+S.set.kelas;

    a5[0]=S.set.nipKepsek?'NIP. '+S.set.nipKepsek:'';a5[c2]=S.set.nipGuru?'NIP. '+S.set.nipGuru:'';
    row(a1);row(a2);row([]);row([]);row([]);row(a4);row(a5);
  }
  return {aoa:aoa,merges:merges,hr:hr,n:n};
}
function lapXlsx(){

  var f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';

/* ---- unduhan generik ---- */
function triggerDownload(blob,name){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url)},4000);
}
function downloadCsv(aoa,name,sep){
  sep=sep||';';
  var txt=aoa.map(function(r){return r.map(function(v){v=v==null?'':String(v);return (v.indexOf(sep)>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)?'"'+v.replace(/"/g,'""')+'"':v}).join(sep)}).join('\r\n');
  triggerDownload(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}),name);
}
function downloadXlsx(sheets,name){
  var wb=XLSX.utils.book_new();
  sheets.forEach(function(sh){
    var ws=XLSX.utils.aoa_to_sheet(sh.aoa);
    (sh.textCols||[]).forEach(function(c){for(var r=1;r<sh.aoa.length;r++){var cell=ws[XLSX.utils.encode_cell({r:r,c:c})];if(cell){cell.t='s';cell.v=String(cell.v)}}});
    var w=sh.aoa[0].map(function(h,c){var m=String(h).length;sh.aoa.forEach(function(r){m=Math.max(m,String(r[c]==null?'':r[c]).length)});return {wch:Math.min(m+2,40)}});
    ws['!cols']=w;XLSX.utils.book_append_sheet(wb,ws,sh.name);
  });
  triggerDownload(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name);
  toast('File diunduh.');
}

/* =====================================================================
   DAFTAR NILAI (mata pelajaran, penilaian berbobot, nilai siswa)
   ===================================================================== */
function mapelList(){return S.mapel.slice().sort(function(a,b){return (a.urutan-b.urutan)||a.nama.localeCompare(b.nama,'id')})}
function penList(mid,sem){return S.pen.filter(function(p){return p.mapelId===mid&&p.semester===sem}).sort(function(a,b){return a.urutan-b.urutan})}
function nilaiSaved(sid,pid){var v=S.nilai[sid+'|'+pid];return v===undefined?null:v}
function nilaiOf(sid,pid){
  var k=sid+'|'+pid;
  if(Object.prototype.hasOwnProperty.call(UI.nDraft,k)){var d=UI.nDraft[k];return (d===''||isNaN(Number(d)))?null:Number(d)}
  return nilaiSaved(sid,pid);
}
/* Nilai akhir = Σ(nilai × bobot) ÷ Σ(bobot penilaian yang sudah terisi). Bila ada yang belum terisi, hasil bertanda * (sementara). */
function hitungAkhir(sid,pens,get){
  get=get||nilaiOf;var sb=0,sn=0,filled=0,tb=0;
  pens.forEach(function(p){tb+=p.bobot;var v=get(sid,p.id);if(v!==null){sn+=v*p.bobot;sb+=p.bobot;filled++}});
  return {akhir:sb>0?sn/sb:null,lengkap:pens.length>0&&filled===pens.length,filled:filled,tb:tb};
}
function nTxt(v){return v==null?'–':String(Math.round(v*100)/100).replace('.',',')}
function nPill(v,kkm,lengkap){
  if(v==null)return '<span class="pill p-na">–</span>';
  return '<span class="pill '+(v>=kkm?'p-good':'p-bad')+'">'+num(v,1)+(lengkap?'':'*')+'</span>';
}
function totalBobot(pens){return pens.reduce(function(a,p){return a+p.bobot},0)}
function bobotBadge(tb){
  var ok=Math.abs(tb-100)<0.005;
  return '<span class="badge '+(ok?'b-ok':'b-demo')+'">Total bobot '+bobotTxt(tb)+'%'+(ok?' ✔':' (idealnya 100%)')+'</span>';
}
function bobotTxt(b){return String(Math.round(b*100)/100).replace('.',',')}

}

  h+='</tbody></table></div>';
  el.innerHTML=h;nStats();

function nKet(v,kkm){return v==null?'<span class="hint">–</span>':'<span class="badge '+(v>=kkm?'b-ok':'b-no')+'">'+(v>=kkm?'Tuntas':'Belum tuntas')+'</span>'}
function nIn(inp){
  var sid=inp.getAttribute('data-s'),pid=inp.getAttribute('data-p'),v=inp.value.trim(),n=Number(v);

function nStats(){
  var el=$('#nStat');if(!el)return;
  var m=S.mapel.filter(function(x){return x.id===UI.nMapel})[0],pens=penList(m.id,UI.nSem),vals=[],tun=0,lengkap=0,list=aktifSiswa();
  list.forEach(function(s){var r=hitungAkhir(s.id,pens);if(r.akhir!=null){vals.push(r.akhir);if(r.akhir>=m.kkm)tun++}if(r.lengkap)lengkap++});
  var avg=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:null;

async function nSimpan(){

function penEven(){
  var n=UI.penEdit.length;if(!n)return;
  var each=Math.floor(10000/n)/100,rest=Math.round((100-each*n)*100)/100;
  UI.penEdit.forEach(function(p,i){p.bobot=String(i===n-1?Math.round((each+rest)*100)/100:each)});penDraw();
}
function penTpl(){
  var old={};UI.penEdit.forEach(function(p){old[p.nama.toLowerCase()]=p.id});
  UI.penEdit=[['Tugas',20],['Ulangan Harian',20],['UTS',25],['UAS',35]].map(function(t){return {id:old[t[0].toLowerCase()]||'',nama:t[0],bobot:String(t[1])}});penDraw();
}
async function penSimpan(){
  var list=[],tb=0;
  for(var i=0;i<UI.penEdit.length;i++){
    var p=UI.penEdit[i],nm=p.nama.trim(),b=Number(String(p.bobot).replace(',','.'));
    if(!nm){toast('Nama penilaian baris '+(i+1)+' wajib diisi.','err');return}
    if(String(p.bobot).trim()===''||isNaN(b)||b<0||b>100){toast('Bobot "'+nm+'" harus angka 0–100.','err');return}
    tb+=b;list.push({id:p.id,nama:nm,bobot:b});
  }
  if(list.length&&Math.abs(tb-100)>=0.005&&!(await confirmBox('Total bobot saat ini <b>'+bobotTxt(tb)+'%</b>, bukan 100%. Nilai akhir tetap dihitung proporsional terhadap total bobot. Tetap simpan?','Simpan')))return;
  var mid=UI.penMid;
  try{
    var r=await act('api_savePenilaianSet',[mid,UI.nSem,list],{txt:'Menyimpan penilaian…'});
    S.pen=S.pen.filter(function(x){return !(x.mapelId===mid&&x.semester===UI.nSem)}).concat(r.pen.map(penFix));
    r.dihapus.forEach(function(id){Object.keys(S.nilai).forEach(function(k){if(k.split('|')[1]===id)delete S.nilai[k]})});
    UI.nDraft={};UI.dirty=false;closeModal();toast('Penilaian dan bobot disimpan.');renderNilai();
  }catch(e){}
}
function penFix(p){return {id:p.id,mapelId:p.mapelId,semester:p.semester,nama:p.nama,bobot:Number(p.bobot),urutan:Number(p.urutan)}}

  var h='<div class="ph"><h2>⚙️ Pengaturan</h2>'+(admin?'':'<span class="chip">Mode lihat saja – pengaturan sekolah hanya dapat diubah Administrator</span>')+'</div><div class="grid g2">';
  h+='<div class="card"><h3>🏫 Identitas sekolah dan kelas</h3><div class="form2">'+f('Nama sekolah','sNama',s.namaSekolah)+f('Kota (untuk tanda tangan)','sKota',s.kota)+f('Alamat sekolah','sAlamat',s.alamatSekolah)+f('Kelas','sKelas',s.kelas)+f('Tahun ajaran','sTA',s.tahunAjaran,'text',' placeholder="2026/2027"')+
    '<div class="fld"><label for="sSemA">Semester aktif</label><select id="sSemA"'+dis+'><option value="1"'+(s.semesterAktif==='1'?' selected':'')+'>Semester 1</option><option value="2"'+(s.semesterAktif==='2'?' selected':'')+'>Semester 2</option></select></div></div></div>';
  h+='<div class="card"><h3>📆 Tanggal semester</h3><div class="form2">'+f('Semester 1 – mulai','sS1a',s.sem1Mulai,'date')+f('Semester 1 – selesai','sS1b',s.sem1Selesai,'date')+f('Semester 2 – mulai','sS2a',s.sem2Mulai,'date')+f('Semester 2 – selesai','sS2b',s.sem2Selesai,'date')+'</div><p class="hint">Sesuaikan dengan kalender pendidikan sekolah Anda.</p></div>';
  var hs=hariSekolahSet();
  h+='<div class="card"><h3>🗓️ Hari sekolah rutin</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'+[1,2,3,4,5,6,0].map(function(d){return '<label class="chip"><input type="checkbox" class="hsk" value="'+d+'" style="width:auto" '+(hs.indexOf(d)>=0?'checked':'')+dis+'> '+HARI[d]+'</label>'}).join('')+'</div><p class="hint">Hari libur dan tanggal khusus diatur di menu Kalender Presensi.</p></div>';
  h+='<div class="card"><h3>🎯 Indikator kehadiran</h3><div class="form2">'+f('Batas baik (hijau) ≥ %','sBaik',s.batasBaik,'number',' min="0" max="100"')+f('Batas waspada (kuning) ≥ %','sWasp',s.batasWaspada,'number',' min="0" max="100"')+'</div><p class="hint">Di bawah batas waspada ditampilkan merah.</p></div>';
  h+='<div class="card"><h3>✍️ Format laporan dan tanda tangan</h3><div class="form2">'+f('Nama guru kelas','sGuru',s.namaGuru)+f('NIP guru kelas','sNipG',s.nipGuru)+f('Nama kepala sekolah','sKep',s.namaKepsek)+f('NIP kepala sekolah','sNipK',s.nipKepsek)+
    '<div class="fld"><label for="sOri">Orientasi kertas</label><select id="sOri"'+dis+'><option value="auto"'+(s.orientasi==='auto'?' selected':'')+'>Otomatis</option><option value="portrait"'+(s.orientasi==='portrait'?' selected':'')+'>Potret</option><option value="landscape"'+(s.orientasi==='landscape'?' selected':'')+'>Lanskap</option></select></div>'+
    '<div class="fld"><label for="sSep">Pemisah CSV</label><select id="sSep"'+dis+'><option value=";"'+(s.csvSep===';'?' selected':'')+'>Titik koma (;) – Excel Indonesia</option><option value=","'+(s.csvSep===','?' selected':'')+'>Koma (,)</option></select></div>'+
    '<div class="fld"><label>Gambar tanda tangan guru</label><div>'+(s.ttdGuru?'<img class="sigprev" id="pvG" src="'+s.ttdGuru+'" alt="">':'<span class="hint" id="pvGt">Belum ada</span>')+'</div>'+(admin?'<input type="file" accept="image/*" onchange="uploadTtd(this,\'ttdGuru\')"><button class="btn sm ghost" onclick="hapusTtd(\'ttdGuru\')">Hapus</button>':'')+'</div>'+
    '<div class="fld"><label>Gambar tanda tangan kepala sekolah</label><div>'+(s.ttdKepsek?'<img class="sigprev" id="pvK" src="'+s.ttdKepsek+'" alt="">':'<span class="hint" id="pvKt">Belum ada</span>')+'</div>'+(admin?'<input type="file" accept="image/*" onchange="uploadTtd(this,\'ttdKepsek\')"><button class="btn sm ghost" onclick="hapusTtd(\'ttdKepsek\')">Hapus</button>':'')+'</div></div>'+
    '<p class="hint">Gambar tanda tangan opsional. Tanpa gambar, laporan menyediakan ruang kosong untuk tanda tangan basah.</p></div>';
  h+='</div>';
  if(admin)h+='<p style="margin:14px 0"><button class="btn ok" onclick="simpanPengaturan()">💾 Simpan pengaturan</button></p>';
  h+='<div class="grid g2"><div class="card"><h3>🔑 Ganti kata sandi saya</h3><div class="form2"><div class="fld full"><label for="pwL">Kata sandi lama</label><input type="password" id="pwL" autocomplete="current-password"></div><div class="fld"><label for="pwB">Kata sandi baru (min. 6)</label><input type="password" id="pwB" autocomplete="new-password"></div><div class="fld"><label for="pwB2">Ulangi kata sandi baru</label><input type="password" id="pwB2" autocomplete="new-password"></div></div><p><button class="btn pri" onclick="gantiPw()">Ganti kata sandi</button></p></div>';
  if(admin){
    h+='<div class="card"><h3>💾 Data dan cadangan</h3><div class="row"><button class="btn" onclick="cadanganJson()">⬇️ Unduh cadangan (JSON)</button><button class="btn" onclick="cadanganDrive()">☁️ Salin ke Google Drive</button>'+(S.dbUrl?'<a class="btn ghost" href="'+esc(S.dbUrl)+'" target="_blank" rel="noopener">📄 Buka Google Sheets</a>':'')+'</div>'+
      (S.siswa.some(function(x){return x.demo})?'<p class="note" style="margin-top:12px">Masih ada data siswa contoh. <button class="btn sm bad" onclick="hapusDemo()">Hapus semua data contoh</button></p>':'<p class="hint">Tidak ada data contoh.</p>')+'</div>';
    h+='<div class="card" style="grid-column:1/-1"><h3>👥 Pengguna</h3><div class="tw"><table class="tbl"><thead><tr><th class="l">Nama pengguna</th><th class="l">Nama</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+
      S.users.map(function(u){return '<tr><td class="l">'+esc(u.username)+'</td><td class="l">'+esc(u.nama)+'</td><td>'+(u.peran==='admin'?'Administrator':'Guru')+'</td><td><span class="badge '+(u.aktif==='TRUE'?'b-ok':'b-no')+'">'+(u.aktif==='TRUE'?'Aktif':'Nonaktif')+'</span></td><td style="white-space:nowrap"><button class="btn sm" onclick="formUser(\''+esc(u.username)+'\')">✏️ Edit</button> '+(u.username!==S.user.username?'<button class="btn sm bad" onclick="hapusUser(\''+esc(u.username)+'\')">🗑️</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div><p><button class="btn ok" onclick="formUser()">➕ Tambah pengguna</button></p></div>';
  }
  h+='</div>';
  $('#pg-pengaturan').innerHTML=h;
}
async function simpanPengaturan(){
  var o={namaSekolah:val('sNama').trim(),kota:val('sKota').trim(),alamatSekolah:val('sAlamat').trim(),kelas:val('sKelas').trim(),tahunAjaran:val('sTA').trim(),semesterAktif:val('sSemA'),
    sem1Mulai:val('sS1a'),sem1Selesai:val('sS1b'),sem2Mulai:val('sS2a'),sem2Selesai:val('sS2b'),
    hariSekolah:$$('.hsk').filter(function(c){return c.checked}).map(function(c){return c.value}).join(','),
    batasBaik:val('sBaik'),batasWaspada:val('sWasp'),namaGuru:val('sGuru').trim(),nipGuru:val('sNipG').trim(),namaKepsek:val('sKep').trim(),nipKepsek:val('sNipK').trim(),orientasi:val('sOri'),csvSep:val('sSep')};
  var m='';
  if(!o.namaSekolah||!o.kelas)m='Nama sekolah dan kelas wajib diisi.';
  else if(!/^\d{4}\/\d{4}$/.test(o.tahunAjaran))m='Tahun ajaran harus berformat 2026/2027.';
  else if(!o.sem1Mulai||!o.sem1Selesai||!o.sem2Mulai||!o.sem2Selesai||o.sem1Selesai<o.sem1Mulai||o.sem2Selesai<o.sem2Mulai)m='Tanggal semester tidak valid.';
  else if(!o.hariSekolah)m='Pilih minimal satu hari sekolah.';
  else if(+o.batasBaik<+o.batasWaspada||isNaN(+o.batasBaik)||isNaN(+o.batasWaspada))m='Batas baik harus lebih besar atau sama dengan batas waspada.';
  if(m){toast(m,'err');return}
  try{var r=await act('api_saveSettings',[o]);S.set=r;headerInfo();var sr=semRange(UI.rsSem);if(!UI.rsCustom){UI.rsA=sr[0];UI.rsB=sr[1]}UI.lap={};toast('Pengaturan disimpan.');renderPengaturan()}catch(e){}
}
function uploadTtd(inp,key){
  var f=inp.files[0];if(!f)return;
  var img=new Image(),rd=new FileReader();
  rd.onload=function(){img.onload=function(){
    var w=Math.min(300,img.width),hh=Math.round(img.height*w/img.width);if(hh>120){hh=120;w=Math.round(img.width*hh/img.height)}
    var c=document.createElement('canvas');c.width=w;c.height=hh;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(img,0,0,w,hh);
    var d=c.toDataURL('image/jpeg',0.8),o={};o[key]=d;
    act('api_saveSettings',[o]).then(function(r){S.set=r;toast('Tanda tangan disimpan.');renderPengaturan()}).catch(function(){});
  };img.onerror=function(){toast('File gambar tidak dapat dibaca.','err')};img.src=rd.result};
  rd.readAsDataURL(f);
}
async function hapusTtd(key){var o={};o[key]='';try{var r=await act('api_saveSettings',[o]);S.set=r;toast('Tanda tangan dihapus.');renderPengaturan()}catch(e){}}
async function gantiPw(){
  if(val('pwB')!==val('pwB2')){toast('Ulangi kata sandi baru dengan sama persis.','err');return}
  if(val('pwB').length<6){toast('Kata sandi baru minimal 6 karakter.','err');return}
  try{await act('api_changePassword',[val('pwL'),val('pwB')]);toast('Kata sandi berhasil diganti.');['pwL','pwB','pwB2'].forEach(function(i){$('#'+i).value=''})}catch(e){}
}
function formUser(un){
  var u=un?S.users.filter(function(x){return x.username===un})[0]:{username:'',nama:'',peran:'guru',aktif:'TRUE'};
  openModal(un?'Edit pengguna':'Tambah pengguna','<div class="form2"><div class="fld"><label for="uU">Nama pengguna</label><input id="uU" type="text" value="'+esc(u.username)+'" '+(un?'disabled':'')+'></div><div class="fld"><label for="uN">Nama lengkap</label><input id="uN" type="text" value="'+esc(u.nama)+'"></div>'+
    '<div class="fld"><label for="uP">Peran</label><select id="uP"><option value="guru"'+(u.peran==='guru'?' selected':'')+'>Guru</option><option value="admin"'+(u.peran==='admin'?' selected':'')+'>Administrator</option></select></div><div class="fld"><label for="uA">Status</label><select id="uA"><option value="1"'+(u.aktif==='TRUE'?' selected':'')+'>Aktif</option><option value="0"'+(u.aktif!=='TRUE'?' selected':'')+'>Nonaktif</option></select></div>'+
    '<div class="fld full"><label for="uW">'+(un?'Kata sandi baru (kosongkan jika tidak diubah)':'Kata sandi (min. 6 karakter)')+'</label><input id="uW" type="password" autocomplete="new-password"></div></div>',[
    {text:'Batal',cls:'ghost',fn:closeModal},
    {text:'Simpan',cls:'pri',fn:async function(){
      try{var r=await act('api_saveUser',[{username:val('uU'),nama:val('uN'),peran:val('uP'),aktif:val('uA')==='1',password:val('uW')}]);S.users=r;closeModal();toast('Pengguna disimpan.');renderPengaturan()}catch(e){}
    }}]);
}
async function hapusUser(un){
  if(!(await confirmBox('Hapus pengguna <b>'+esc(un)+'</b>?','Ya, hapus','bad')))return;
  try{S.users=await act('api_deleteUser',[un]);toast('Pengguna dihapus.');renderPengaturan()}catch(e){}
}
async function hapusDemo(){
  if(!(await confirmBox('Hapus semua siswa bertanda CONTOH beserta presensinya?','Ya, hapus','bad')))return;
  try{var n=await act('api_hapusDemo');await refreshData();toast(n+' data contoh dihapus.');renderPengaturan()}catch(e){}
}
async function cadanganJson(){
  try{var j=await act('api_backupJson',[],{txt:'Menyiapkan cadangan…'});triggerDownload(new Blob([j],{type:'application/json'}),'Cadangan_Presensi_'+today()+'.json');toast('Cadangan diunduh.')}catch(e){}
}
async function cadanganDrive(){
  try{var u=await act('api_backupDrive',[],{txt:'Menyalin ke Drive…'});openModal('Cadangan dibuat','<p>Salinan basis data tersimpan di Google Drive Anda.</p><p><a href="'+esc(u)+'" target="_blank" rel="noopener">Buka salinan</a></p>',[{text:'Tutup',cls:'pri',fn:closeModal}])}catch(e){}
}
